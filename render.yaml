services:
  - type: web
    name: equipment-reservation-api
    env: python
    region: us-east-1
    plan: free
    
    buildCommand: pip install --no-cache-dir --prefer-binary -r requirements-prod.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT --timeout 120 app:app
    
    autoDeploy: true
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
      - key: PIP_NO_CACHE_DIR
        value: 1
      - key: PIP_DEFAULT_TIMEOUT
        value: 1000
