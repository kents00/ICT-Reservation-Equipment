<!-- Header -->
<header class="dashboard-header">
    <div class="header-left">
        <button class="menu-toggle" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <h2 class="page-title">{% block page_title %}{% endblock %}</h2>
    </div>

    <div class="header-right">
        <div class="search-bar-container">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" id="searchInput" placeholder="Search Equipment, Reservations, Users..."
                    class="search-input">
                <button class="search-clear" id="searchClear" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Search Dropdown -->
            <div class="search-dropdown" id="searchDropdown" style="display: none;">
                <div class="search-results-wrapper">
                    <p class="search-summary" id="searchSummary">Start typing to search...</p>
                    <div class="search-results" id="searchResults">
                        <!-- Equipment Results -->
                        <div class="results-section" data-section="equipment">
                            <h3 class="results-category">
                                <i class="fas fa-cube"></i> Equipment
                            </h3>
                            <div class="results-list" id="equipment-results"></div>
                        </div>

                        <!-- Reservations Results -->
                        <div class="results-section" data-section="reservations">
                            <h3 class="results-category">
                                <i class="fas fa-calendar-check"></i> Reservations
                            </h3>
                            <div class="results-list" id="reservations-results"></div>
                        </div>

                        <!-- Users Results -->
                        <div class="results-section" data-section="users">
                            <h3 class="results-category">
                                <i class="fas fa-users"></i> Users
                            </h3>
                            <div class="results-list" id="users-results"></div>
                        </div>

                        <!-- Approvals Results -->
                        <div class="results-section" data-section="approvals">
                            <h3 class="results-category">
                                <i class="fas fa-check-circle"></i> Approvals
                            </h3>
                            <div class="results-list" id="approvals-results"></div>
                        </div>

                        <!-- Reports Results -->
                        <div class="results-section" data-section="reports">
                            <h3 class="results-category">
                                <i class="fas fa-chart-bar"></i> Reports
                            </h3>
                            <div class="results-list" id="reports-results"></div>
                        </div>

                        <!-- Settings Results -->
                        <div class="results-section" data-section="settings">
                            <h3 class="results-category">
                                <i class="fas fa-cog"></i> Settings
                            </h3>
                            <div class="results-list" id="settings-results"></div>
                        </div>
                    </div>
                    <div class="search-no-results" id="searchNoResults" style="display: none;">
                        <p>No results found. Try a different search term.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="header-actions">
            <button class="icon-btn notifications-btn" id="notificationsBtn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="notification-badge" id="notificationBadge">0</span>
            </button>
        </div>
    </div>
</header>
