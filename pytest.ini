[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    auth: Authentication tests
    equipment: Equipment management tests
    reservation: Reservation management tests
    admin: Admin management tests
    qrcode: QR code scanning tests
    reports: Reports and analytics tests
